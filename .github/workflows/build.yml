name: Build iOS dylib (Sheepct Engine)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Compile dylib via Makefile
      run: |
        make all

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GhostSoulM_AllMod-Dylib
        path: GhostSoulM_AllMod.dylib
